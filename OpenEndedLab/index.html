<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pikachu PokéAPI Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: 
        radial-gradient(circle at 20% 50%, rgba(255, 204, 1, 0.1) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(102, 126, 234, 0.1) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
    }

    .navbar {
      background: rgba(255, 255, 255, 0.95) !important;
      backdrop-filter: blur(10px);
      border: none;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
      padding: 1.5rem 0;
    }

    .navbar h1 {
      background: linear-gradient(135deg, #ffcc01 0%, #ff6b6b 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      font-weight: 800;
      font-size: 2rem;
      text-shadow: 0 2px 10px rgba(255, 204, 1, 0.3);
      animation: glow 2s ease-in-out infinite alternate;
    }

    @keyframes glow {
      from { filter: drop-shadow(0 0 5px rgba(255, 204, 1, 0.5)); }
      to { filter: drop-shadow(0 0 20px rgba(255, 204, 1, 0.8)); }
    }

    .nav-tabs {
      border: none;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      padding: 1rem;
      border-radius: 20px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
    }

    .nav-tabs .nav-link {
      border: none;
      color: white;
      font-weight: 600;
      padding: 12px 24px;
      border-radius: 15px;
      transition: all 0.3s ease;
      margin: 0 5px;
    }

    .nav-tabs .nav-link:hover {
      background: rgba(255, 255, 255, 0.2);
      transform: translateY(-2px);
    }

    .nav-tabs .nav-link.active {
      background: linear-gradient(135deg, #ffcc01 0%, #ff6b6b 100%);
      color: white !important;
      box-shadow: 0 4px 15px rgba(255, 204, 1, 0.4);
      transform: scale(1.05);
    }

    .tab-content {
      margin-top: 30px;
    }

    .search-container {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      padding: 2rem;
      border-radius: 20px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
      margin-bottom: 2rem;
    }

    #poke-query {
      border: 2px solid #e0e0e0;
      border-radius: 15px;
      padding: 12px 20px;
      font-size: 1rem;
      transition: all 0.3s ease;
      width: 300px !important;
    }

    #poke-query:focus {
      border-color: #ffcc01;
      box-shadow: 0 0 0 3px rgba(255, 204, 1, 0.2);
      outline: none;
    }

    .btn-pika {
      background: linear-gradient(135deg, #ffcc01 0%, #ff6b6b 100%);
      color: white;
      border: none;
      padding: 12px 30px;
      border-radius: 15px;
      font-weight: 600;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(255, 204, 1, 0.4);
    }

    .btn-pika:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(255, 204, 1, 0.6);
      color: white;
    }

    .card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border: none;
      border-radius: 20px;
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
      overflow: hidden;
      position: relative;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, #ffcc01 0%, #ff6b6b 100%);
      transform: scaleX(0);
      transition: transform 0.3s ease;
    }

    .card:hover {
      transform: translateY(-10px) scale(1.02);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
    }

    .card:hover::before {
      transform: scaleX(1);
    }

    .card img {
      transition: all 0.3s ease;
      filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.2));
    }

    .card:hover img {
      transform: scale(1.1) rotate(5deg);
    }

    .card h5, .card h6 {
      color: #333;
      font-weight: 700;
    }

    .type {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 20px;
      color: white;
      font-size: 0.75rem;
      font-weight: 600;
      margin: 3px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .evo-container {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 2rem;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
      transition: all 0.3s ease;
    }

    .evo-container:hover {
      transform: translateY(-5px);
      box-shadow: 0 12px 48px rgba(0, 0, 0, 0.15);
    }

    .evo-arrow {
      font-size: 2rem;
      color: #ffcc01;
      font-weight: bold;
      animation: bounce 1s infinite;
    }

    @keyframes bounce {
      0%, 100% { transform: translateX(0); }
      50% { transform: translateX(10px); }
    }

    .evo-sprite {
      transition: all 0.3s ease;
    }

    .evo-sprite:hover {
      transform: scale(1.2);
    }

    .loading {
      display: inline-block;
      width: 50px;
      height: 50px;
      border: 5px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: #ffcc01;
      animation: spin 1s ease-in-out infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .fade-in {
      animation: fadeIn 0.5s ease-in;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .stat-badge {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 0.8rem;
      font-weight: 600;
      display: inline-block;
      margin: 2px;
    }

    /* Scrollbar styling */
    ::-webkit-scrollbar {
      width: 10px;
    }

    ::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.1);
    }

    ::-webkit-scrollbar-thumb {
      background: linear-gradient(135deg, #ffcc01 0%, #ff6b6b 100%);
      border-radius: 10px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: linear-gradient(135deg, #ff6b6b 0%, #ffcc01 100%);
    }

    @media (max-width: 768px) {
      .navbar h1 {
        font-size: 1.5rem;
      }
      
      #poke-query {
        width: 200px !important;
      }
    }
  </style>
</head>

<body>
  <nav class="navbar navbar-expand-lg">
    <div class="container-fluid justify-content-center">
      <h1 class="fw-bold">Pokémons</h1>
    </div>
  </nav>

  <div class="container mt-4">
    <ul class="nav nav-tabs justify-content-center" id="pikaTabs" role="tablist">
      <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#pokemon" type="button">Pokémon</button></li>
      <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#types" type="button">Types</button></li>
      <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#evolutions" type="button">Evolutions</button></li>
      <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#moves" type="button">Moves</button></li>
      <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#items" type="button">Items</button></li>
    </ul>

    <div class="tab-content" id="pikaTabsContent">
      <div class="tab-pane fade show active" id="pokemon">
        <div class="search-container text-center">
          <form class="d-inline-block" onsubmit="searchPokemon(event)">
            <input type="text" id="poke-query" class="form-control d-inline-block" placeholder="Search Pokémon (e.g., pikachu)">
            <button type="submit" class="btn btn-pika ms-2">Search</button>
          </form>
        </div>
        <div id="poke-grid" class="row g-4 justify-content-center"></div>
      </div>

      <div class="tab-pane fade" id="types">
        <div id="types-grid" class="row g-4 justify-content-center"></div>
      </div>

      <div class="tab-pane fade" id="evolutions">
        <div id="evo-chain" class="d-flex flex-wrap justify-content-center gap-4"></div>
      </div>

      <div class="tab-pane fade" id="moves">
        <div id="moves-grid" class="row g-4 justify-content-center"></div>
      </div>

      <div class="tab-pane fade" id="items">
        <div id="items-grid" class="row g-4 justify-content-center"></div>
      </div>
    </div>
  </div>

  <script>
    const BASE_URL = 'https://pokeapi.co/api/v2';

    window.onload = async () => {
      await Promise.all([loadPokemon(), loadTypes(), loadEvolutionChains(), loadMoves(), loadItems()]);
    };

    async function loadPokemon() {
      const res = await fetch(`${BASE_URL}/pokemon?limit=20`);
      const data = await res.json();
      const container = document.getElementById('poke-grid');
      container.innerHTML = '<div class="col-12 text-center"><div class="loading"></div></div>';
      
      const cards = [];
      for (const poke of data.results) {
        const pokeRes = await fetch(poke.url);
        const pokeData = await pokeRes.json();
        cards.push(renderPokemonCard(pokeData));
      }
      container.innerHTML = cards.join('');
      container.querySelectorAll('.card').forEach((card, i) => {
        setTimeout(() => card.classList.add('fade-in'), i * 50);
      });
    }

    function renderPokemonCard(p) {
      const types = p.types.map(t => `<span class="type" style="background:${getTypeColor(t.type.name)}">${t.type.name}</span>`).join('');
      return `
        <div class="col-lg-3 col-md-4 col-sm-6">
          <div class="card text-center p-4 shadow-sm">
            <img src="${p.sprites.front_default}" alt="${p.name}" class="mx-auto" style="width:120px;">
            <h5 class="fw-bold mt-3 text-capitalize">${p.name}</h5>
            <div class="mt-2">${types}</div>
            <div class="mt-2">
              <span class="stat-badge">HP: ${p.stats[0].base_stat}</span>
              <span class="stat-badge">ATK: ${p.stats[1].base_stat}</span>
            </div>
          </div>
        </div>`;
    }

    function getTypeColor(type) {
      const colors = {
        fire: '#f08030', water: '#6890f0', grass: '#78c850', electric: '#f8d030',
        bug: '#a8b820', normal: '#a8a878', poison: '#a040a0', ground: '#e0c068',
        fairy: '#ee99ac', fighting: '#c03028', psychic: '#f85888', rock: '#b8a038',
        ghost: '#705898', ice: '#98d8d8', dragon: '#7038f8', dark: '#705848',
        steel: '#b8b8d0', flying: '#a890f0'
      };
      return colors[type] || '#ccc';
    }

    async function searchPokemon(event) {
      event.preventDefault();
      const query = document.getElementById('poke-query').value.toLowerCase().trim();
      if (!query) return;
      
      const container = document.getElementById('poke-grid');
      container.innerHTML = '<div class="col-12 text-center"><div class="loading"></div></div>';
      
      try {
        const res = await fetch(`${BASE_URL}/pokemon/${query}`);
        if (!res.ok) throw new Error('Not found');
        const data = await res.json();
        container.innerHTML = renderPokemonCard(data);
        container.querySelector('.card').classList.add('fade-in');
      } catch (error) {
        container.innerHTML = '<div class="col-12 text-center"><div class="alert alert-warning">Pokémon not found! Try another name.</div></div>';
      }
    }

    async function loadTypes() {
      const res = await fetch(`${BASE_URL}/type`);
      const data = await res.json();
      const container = document.getElementById('types-grid');
      container.innerHTML = data.results.map(t => `
        <div class="col-lg-2 col-md-3 col-sm-4">
          <div class="card p-3 text-center shadow-sm">
            <h6 class="fw-bold text-capitalize mb-0">${t.name}</h6>
          </div>
        </div>`).join('');
    }

    async function loadEvolutionChains() {
      const container = document.getElementById('evo-chain');
      container.innerHTML = '<div class="loading"></div>';
      
      const chains = [];
      for (let i = 1; i <= 5; i++) {
        const res = await fetch(`${BASE_URL}/evolution-chain/${i}`);
        const data = await res.json();
        chains.push(`
          <div class="evo-container fade-in">
            ${buildEvolutionChain(data.chain)}
          </div>`);
      }
      container.innerHTML = chains.join('');
    }

    function buildEvolutionChain(chain) {
      let html = '<div class="d-flex align-items-center justify-content-center flex-wrap">';
      let current = chain;
      while (current) {
        const name = current.species.name;
        const id = current.species.url.split('/')[6];
        html += `
          <div class="text-center m-2">
            <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${id}.png" width="80" class="evo-sprite">
            <div class="fw-bold text-capitalize mt-2">${name}</div>
          </div>`;
        if (current.evolves_to.length > 0) html += `<span class="evo-arrow mx-2">→</span>`;
        current = current.evolves_to[0];
      }
      html += '</div>';
      return html;
    }

    async function loadMoves() {
      const res = await fetch(`${BASE_URL}/move?limit=10`);
      const data = await res.json();
      const container = document.getElementById('moves-grid');
      container.innerHTML = '<div class="col-12 text-center"><div class="loading"></div></div>';
      
      const moves = [];
      for (const move of data.results) {
        const moveRes = await fetch(move.url);
        const moveData = await moveRes.json();
        moves.push(`
          <div class="col-lg-4 col-md-6">
            <div class="card p-4 shadow-sm fade-in">
              <h5 class="fw-bold text-capitalize">${moveData.name.replace('-', ' ')}</h5>
              <div class="mt-2">
                <span class="stat-badge">Power: ${moveData.power || 'N/A'}</span>
                <span class="stat-badge">Accuracy: ${moveData.accuracy || 'N/A'}%</span>
              </div>
              <p class="mt-3 mb-0 small">${moveData.effect_entries[0]?.short_effect || 'No description available'}</p>
            </div>
          </div>`);
      }
      container.innerHTML = moves.join('');
    }

    async function loadItems() {
      const res = await fetch(`${BASE_URL}/item?limit=12`);
      const data = await res.json();
      const container = document.getElementById('items-grid');
      container.innerHTML = '<div class="col-12 text-center"><div class="loading"></div></div>';
      
      const items = [];
      for (const item of data.results) {
        const itemRes = await fetch(item.url);
        const itemData = await itemRes.json();
        items.push(`
          <div class="col-lg-3 col-md-4 col-sm-6">
            <div class="card p-4 text-center shadow-sm fade-in">
              <img src="${itemData.sprites.default}" width="64" class="mx-auto">
              <h6 class="fw-bold mt-3 text-capitalize">${itemData.name.replace('-', ' ')}</h6>
              <p class="small mt-2 mb-0">${itemData.effect_entries[0]?.short_effect || 'No description available'}</p>
            </div>
          </div>`);
      }
      container.innerHTML = items.join('');
    }
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
