<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Form Validation</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      padding: 40px;
    }

    form {
      background: #fff;
      max-width: 400px;
      margin: auto;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0 0 8px rgba(0, 0, 0, 0.2);
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-top: 10px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
      border-radius: 5px;
      border: 1px solid #ccc;
    }

    .err {
      color: red;
      font-size: 0.9em;
    }

    button {
      margin-top: 15px;
      padding: 10px;
      width: 100%;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background-color: #45a049;
    }
  </style>
</head>
<body>
  <form id="signupForm">
    <h2>Sign Up Form</h2>

    <label for="fname">First Name:</label>
    <input type="text" id="fname" />
    <span class="err" id="fname_err"></span>

    <label for="lname">Last Name:</label>
    <input type="text" id="lname" />
    <span class="err" id="lname_err"></span>

    <label for="phone">Phone:</label>
    <input type="text" id="phone" />
    <span class="err" id="phone_err"></span>

    <label for="emailField">Email:</label>
    <input type="text" id="emailField" />
    <span class="err" id="email_err"></span>

    <label for="pass">Password:</label>
    <input type="password" id="pass" />
    <span class="err" id="pass_err"></span>

    <label for="confirmPass">Confirm Password:</label>
    <input type="password" id="confirmPass" />
    <span class="err" id="confirmPass_err"></span>

    <button type="submit">Register</button>
  </form>

  <script src="script.js"></script>
</body>
</html>
